<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX 퀴즈 · 클라우드 진행실</title><style>:root{font-family:'Malgun Gothic',system-ui,sans-serif;color:#eef3ff;background:#0b1220;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.login{width:min(100%,440px);padding:28px;border:1px solid #405272;border-radius:20px;background:#141f32}h1{font-size:30px;margin:10px 0}p{line-height:1.6;color:#b8c8e4}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:bold}label{display:flex;flex-direction:column;gap:8px;margin-top:24px}input,button{font:inherit;border-radius:12px;width:100%;padding:15px;font-size:18px}input{background:#0c1525;color:#fff;border:1px solid #43516a}button{margin-top:18px;background:#bcb0ff;color:#171229;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#login-status{color:#ffdf93;min-height:1.6em;font-size:14px}.small{font-size:13px}</style></head><body><main class="login"><div class="eyebrow">OX QUIZ · CLOUD CONTROL</div><h1>클라우드 진행실</h1><p>핸드폰으로 문제를 넘기고<br>노트북 스크린을 함께 제어하세요.</p><form id="login-form"><label>진행자 PIN<input id="host-pin" type="password" autocomplete="current-password" required></label><button id="login-button">진행실 연결</button><p id="login-status" role="status" aria-live="polite"></p></form><p class="small">진행자 전용 화면입니다. 스크린은 로그인 후 제공되는 스크린 링크로 연결합니다.</p></main><script>
const form=document.getElementById('login-form'),button=document.getElementById('login-button'),status=document.getElementById('login-status');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='진행실에 연결하는 중입니다.';try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('host-pin').value})});const data=await response.json();if(!response.ok)throw Error(data?.error?.message||data?.error||data?.message||'PIN을 확인해 주세요.');document.getElementById('host-pin').value='';location.assign('/presenter');}catch(error){status.textContent=error.message||'인터넷 연결을 확인해 주세요.';button.disabled=false;}});
</script></body></html>
