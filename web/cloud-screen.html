<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX 퀴즈 · 클라우드 스크린</title><style>/*__CLOUD_STYLE__*/
.screen-tools{position:fixed;right:10px;top:10px;z-index:30;display:flex;align-items:center;gap:8px;max-width:90vw;padding:7px;background:#0b1220db;border:1px solid #405272;border-radius:10px;font-size:12px}.screen-tools button{font-size:12px;padding:7px 10px}.screen-tools p{margin:0;font-size:12px}.screen-key-panel{position:fixed;inset:0;z-index:50;background:#0b1220;display:grid;place-items:center;padding:24px}.screen-key-panel[hidden],#youtube-panel[hidden]{display:none}.screen-key-panel form{width:min(100%,440px)}.screen-key-panel button{width:100%;margin-top:15px}.screen-key-panel p{font-size:16px}.screen-key-panel input{font-size:18px}.cloud-youtube{position:fixed;left:10px;top:10px;z-index:25;width:220px;background:#0b1220e8;border:1px solid #405272;border-radius:10px;padding:8px}.cloud-youtube #youtube-player{width:200px;height:200px}.cloud-youtube p{font-size:11px;margin:4px 0}.cloud-youtube button{font-size:12px;padding:6px}.projection.with-youtube .quiz-stage{padding-left:250px}.screen-tools.connected #cloud-screen-status{color:#a6bad6}.screen-tools.disconnected #cloud-screen-status{color:#ffcf73}@media(max-width:600px){.screen-tools{flex-wrap:wrap;max-width:calc(100vw - 20px)}.cloud-youtube{top:80px}.projection.with-youtube .quiz-stage{padding-left:4vw;padding-top:310px}}
</style></head><body class="projection"><div id="stage"><div class="stage"><h1>진행실에 연결하는 중입니다</h1><p>진행자가 공개한 화면이 여기에 나타납니다.</p></div></div>
<div id="screen-tools" class="screen-tools disconnected"><p id="cloud-screen-status" role="status">연결 대기</p><button id="screen-audio-enable">스크린 소리 켜기</button><button id="screen-fullscreen">전체화면</button></div>
<section id="youtube-panel" class="cloud-youtube" hidden><div id="youtube-player"></div><p id="youtube-status" role="status">공식 영상 대기</p><button id="youtube-play">프리티걸 재생</button></section>
<section id="screen-key-panel" class="screen-key-panel" hidden><form id="screen-key-form"><h1>클라우드 스크린 연결</h1><p>핸드폰 진행실의 스크린 링크를 열거나 스크린 키를 입력해 주세요.</p><label>스크린 키<input id="screen-key" type="password" autocomplete="off" required></label><button class="primary">스크린 연결</button><p id="screen-key-status" role="status"></p></form></section>
<script id="prize-data" type="application/json">/*__CLOUD_PRIZES__*/</script><script src="/screen.js"></script></body></html>
